name: Fizzy
options:
  bundleIdPrefix: co.cookedcoke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "7"
settingGroups:
  # My CCC and its App Clip: the App Store needs the clip's version and build to match the app's,
  # so both come from here. Bump the build here for each upload.
  myccc-version:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Fizzy:
    type: application
    platform: iOS
    sources:
      - path: Fizzy
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.cookedcoke.fizzy.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Fizzy/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Fizzy
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # HTTPS only, which is exempt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "To save a receipt photo from Fizzy to your photos."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "To reach a test Fizzy server on the local network, if you set one in This app."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        CODE_SIGN_STYLE: Automatic
  CookedCoke:
    type: application
    platform: iOS
    sources:
      - path: Student
        excludes: [Student.entitlements]
      - path: Fizzy/JSON.swift    # the page data type and formatting, shared with the staff app
    dependencies:
      - target: MyCCCClip   # the App Clip, embedded in the app
    settings:
      groups: [myccc-version]
      base:
        PRODUCT_NAME: CookedCoke
        PRODUCT_BUNDLE_IDENTIFIER: co.cookedcoke.student
        CODE_SIGN_ENTITLEMENTS: Student/Student.entitlements   # opens hunt poster links (link.cookedcoke.co)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: My CCC
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # HTTPS only, which is exempt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "To scan sign-in codes at the counter, and hunt codes around school."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "To reach a test server on the local network, if you set one."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        CODE_SIGN_STYLE: Automatic
  MyCCCClip:
    # The App Clip: a hunt poster's code, opened from the camera with nothing installed (Clip/ClipApp.swift).
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Clip
        excludes: [Clip.entitlements]
      - path: Student/StudentAPI.swift   # isOffline
      - path: Student/Scanner.swift
      - path: Student/HuntCard.swift
      - path: Student/TileReader.swift
      - path: Fizzy/JSON.swift
    settings:
      groups: [myccc-version]   # the same version and build as My CCC
      base:
        PRODUCT_NAME: MyCCCClip
        PRODUCT_BUNDLE_IDENTIFIER: co.cookedcoke.student.Clip
        CODE_SIGN_ENTITLEMENTS: Clip/Clip.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: My CCC
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "To scan the next hunt code."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Brand
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
