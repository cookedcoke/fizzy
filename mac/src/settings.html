<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'">
<title>Settings</title>
<link rel="stylesheet" href="form.css">
</head>
<body>
<form id="form">
  <label for="url">Fizzy address</label>
  <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="https://fizzy.cookedcoke.co">
  <p id="message">Change this only to try the app with a test server. Both windows reload when you save.</p>
  <div class="buttons">
    <button type="button" id="default">Use Default</button>
    <span class="gap"></span>
    <button type="button" id="cancel">Cancel</button>
    <button type="submit">Save</button>
  </div>
</form>
<script>
  const url = document.getElementById('url');
  const message = document.getElementById('message');
  fizzy.get('baseURL').then((v) => { url.value = v; url.select(); });
  async function save(value) {
    const error = await fizzy.submit('settings', value);
    if (error) {
      message.textContent = error;
      message.className = 'bad';
    }
  }
  document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); save(url.value); });
  document.getElementById('default').addEventListener('click', () => save(''));
  document.getElementById('cancel').addEventListener('click', () => fizzy.close());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fizzy.close(); });
</script>
</body>
</html>
