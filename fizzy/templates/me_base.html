<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120F" media="(prefers-color-scheme: dark)">
<title>{% block title %}My Cooked Coke{% endblock %}</title>
<link rel="icon" href="/static/favicon.ico?v={{ V }}" sizes="any">
<link rel="icon" href="/static/logo.svg?v={{ V }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ V }}">
<link rel="manifest" href="{{ me_url('/manifest.webmanifest') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cooked Coke">
<link rel="preload" href="/static/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/me.css?v={{ V }}">
</head>
<body>
{% block body %}{% endblock %}
<script>/* Installed as an app there's no reload button: after a minute away, come back to fresh numbers. */
  (function () { var hid = 0;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) hid = Date.now(); else if (hid && Date.now() - hid > 60000) location.reload();
    });
    addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  })();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });</script>
</body>
</html>
