<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer display · Cooked Coke</title>
<link rel="preload" href="/static/bricolage-latin.woff2?v={{ V }}" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Bricolage"; font-weight: 400 800; font-display: swap; src: url(/static/bricolage-latin.woff2?v={{ V }}) format("woff2") }
  :root { --cream: #FFF7EE; --card: #fff; --ink: #1B1A1F; --muted: #6E6660; --red: #FE0001; --deep: #B30000; --sun: #FFC23D; --ok: #157A43;
          --display: "Bricolage", ui-rounded, system-ui, sans-serif }
  * { box-sizing: border-box; margin: 0 }
  html, body { height: 100% }
  body { background: var(--cream); color: var(--ink); font: 2.2vh/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; cursor: none;
         overflow: hidden; -webkit-user-select: none; user-select: none }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 6vh 7vw;
            opacity: 0; transform: translateY(1.5vh); transition: opacity .25s ease, transform .25s ease; pointer-events: none }
  .screen.on { opacity: 1; transform: none }
  .brand { position: absolute; top: 4vh; left: 7vw; display: flex; align-items: center; gap: 1.2vh; font-family: var(--display); font-weight: 800; font-size: 2.6vh }
  .brand img { height: 4.4vh }
  h1 { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; line-height: 1 }

  /* between customers */
  #idle h1 { font-size: 9vh; max-width: 16ch }
  #idle h1 span { color: var(--red) }
  #idle .lede { font-size: 3.2vh; color: var(--muted); margin-top: 2.4vh }
  #idle .row { display: flex; gap: 2.4vh; margin-top: 5vh; flex-wrap: wrap }
  .chip { background: var(--card); border-radius: 2.4vh; padding: 2vh 2.8vh; box-shadow: 0 1vh 3vh -2vh rgba(140,30,0,.3); font-size: 2.6vh }
  .chip b { display: block; font-family: var(--display); font-size: 3.2vh }
  .chip.hot { background: var(--red); color: #fff }
  #idle .qr { position: absolute; right: 7vw; bottom: 6vh; display: flex; flex-direction: column; align-items: center; gap: 1.6vh;
              text-align: center; font-size: 2.2vh; color: var(--muted) }
  #idle .qr svg { width: 22vh; height: 22vh; background: #fff; border-radius: 2vh; padding: 1.2vh; box-shadow: 0 1vh 3vh -2vh rgba(140,30,0,.3) }
  #idle .qr b { color: var(--ink) }

  /* someone's being served */
  #cust h1 { font-size: 8vh }
  #cust h1 span { color: var(--red) }
  .pts { margin-top: 4vh; display: inline-flex; flex-direction: column; align-self: flex-start; border-radius: 4vh; padding: 3.4vh 4.4vh 3.8vh; color: #fff;
         background: linear-gradient(135deg, var(--red), #E00010 45%, var(--deep)); box-shadow: 0 3vh 6vh -3vh rgba(179,0,0,.6) }
  .pts .k { font-size: 2.6vh; font-weight: 600; opacity: .9 }
  .pts .v { font-family: var(--display); font-weight: 800; font-size: 15vh; line-height: 1; letter-spacing: -.04em; margin-top: 1vh }
  .gain { position: absolute; font-family: var(--display); font-weight: 800; font-size: 7vh; color: var(--red); opacity: 0 }
  .gain.go { animation: gain 2.4s ease-out forwards }
  @keyframes gain { 0% { opacity: 0; transform: translateY(2vh) scale(.9) } 15% { opacity: 1; transform: none } 75% { opacity: 1 } 100% { opacity: 0; transform: translateY(-4vh) } }
  .pts.bump { animation: bump .5s ease-out }
  @keyframes bump { 40% { transform: scale(1.05) } }
  .lines { margin-top: 4vh; display: grid; gap: 1.6vh; font-size: 3vh; max-width: 70vw }
  .lines .ready { color: var(--ok); font-weight: 700 }
  .lines .muted { color: var(--muted) }
  .bubble { position: fixed; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.2)); pointer-events: none;
            animation: rise 1.6s ease-out forwards }
  @keyframes rise { to { transform: translate(var(--dx), var(--dy)); opacity: 0 } }

  /* hidden, or not signed in */
  #blank { align-items: center; text-align: center }
  #blank img { height: 14vh; opacity: .9 }
  #blank p { margin-top: 3vh; font-size: 2.6vh; color: var(--muted) }
  @media (prefers-reduced-motion: reduce) { .screen { transition: none } .gain.go, .pts.bump, .bubble { animation: none } .gain.go { opacity: 1 } }
</style>
</head>
<body>
<div class="brand"><img src="/static/logo.svg?v={{ V }}" alt=""><span>Cooked Coke</span></div>

<section class="screen" id="idle" aria-live="polite">
  <h1>Say your name when you pay. <span>Get points.</span></h1>
  <p class="lede">1 point for every cent. Swap them for free drinks and money off.</p>
  <div class="row" id="idle-row"></div>
  {% if student_site %}<div class="qr">{% if qr %}{{ qr|safe }}{% endif %}<p>Scan to see your points<br><b>{{ student_site }}</b></p></div>{% endif %}
</section>

<section class="screen" id="cust" aria-live="polite">
  <h1>Hey <span id="c-first"></span></h1>
  <div class="pts" id="c-pts"><span class="k">Your points</span><span class="v" id="c-points">0</span></div>
  <div class="gain" id="c-gain"></div>
  <div class="lines" id="c-lines"></div>
</section>

<section class="screen" id="blank"><img src="/static/logo.svg?v={{ V }}" alt=""><p id="blank-msg"></p></section>

<script>
(function () {
  var cur = null, shown = 0, poll = null, back = null, mode = null, hidden = false;
  var IDLE_AFTER = 90000, POLL = 3000;
  var $ = function (id) { return document.getElementById(id); };
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function screen(id) {
    mode = id;
    ["idle", "cust", "blank"].forEach(function (s) { $(s).classList.toggle("on", s === id); });
  }
  function fmt(n) { return Number(n).toLocaleString("en-AU"); }
  function text(el, t, cls) { var p = document.createElement("p"); p.textContent = t; if (cls) p.className = cls; el.appendChild(p); }

  // ---- between customers ----
  function idle() {
    cur = null; stopPoll(); screen("idle"); loadIdle();
  }
  function loadIdle() {
    fetch("/api/display/idle", { credentials: "same-origin", cache: "no-store" }).then(ok).then(function (d) {
      var row = $("idle-row"); row.textContent = "";
      d.events.forEach(function (e) { chip(row, e.multiplier === 2 ? "Double points" : e.multiplier + "x points", e.name || "On today", true); });
      d.rewards.forEach(function (r) { chip(row, r.name, fmt(r.points) + " points"); });
    }).catch(gone);
  }
  function chip(row, big, small, hot) {
    var c = document.createElement("div"); c.className = "chip" + (hot ? " hot" : "");
    var b = document.createElement("b"); b.textContent = big; c.appendChild(b); c.appendChild(document.createTextNode(small)); row.appendChild(c);
  }
  setInterval(function () { if (mode === "idle") loadIdle(); }, 60000);

  // ---- someone's being served ----
  function show(c) {
    if (!c || !c.id) return idle();
    var same = cur === c.id;
    if (!same) { shown = c.points; $("c-points").textContent = fmt(c.points); }
    cur = c.id; $("c-first").textContent = c.first || "there";
    lines(c);
    if (same && c.points > shown) gained(c.points - shown, c.points);
    shown = c.points;
    screen("cust"); startPoll(); later();
  }
  function lines(c) {
    var el = $("c-lines"); el.textContent = "";
    if (c.ready && c.ready.length) text(el, "You can have " + c.ready.join(", ") + " now. Just ask.", "ready");
    else if (c.next) text(el, fmt(c.next.short) + " more points for " + c.next.name + ".");
    if (c.tab) text(el, c.tab, "muted");
  }
  function gained(n, total) {
    var g = $("c-gain"), p = $("c-pts"), r = p.getBoundingClientRect();
    g.textContent = "+" + fmt(n) + " points"; g.style.left = (r.right + innerHeight * .03) + "px"; g.style.top = (r.top + r.height * .3) + "px";
    g.classList.remove("go"); void g.offsetWidth; g.classList.add("go");
    p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
    if (calm) { $("c-points").textContent = fmt(total); return; }
    var from = total - n, t0 = performance.now();
    (function step(t) {
      var k = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - k, 3);
      $("c-points").textContent = fmt(Math.round(from + n * e));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
    for (var i = 0; i < 14; i++) {
      var b = document.createElement("span"), s = 8 + Math.random() * 18;
      b.className = "bubble"; b.style.width = b.style.height = s + "px";
      b.style.left = (r.left + Math.random() * r.width) + "px"; b.style.top = (r.bottom - 20) + "px";
      b.style.setProperty("--dx", (Math.random() * 60 - 30) + "px"); b.style.setProperty("--dy", -(80 + Math.random() * 160) + "px");
      p.appendChild(b); setTimeout(b.remove.bind(b), 1700);
    }
  }
  // A Square sale lands a moment after the tap: check for it while they're on screen.
  function startPoll() {
    stopPoll();
    poll = setInterval(function () {
      if (!cur) return;
      var id = cur;
      fetch("/api/display/customer/" + id, { credentials: "same-origin", cache: "no-store" }).then(ok).then(function (c) {
        if (cur === id) show(c);
      }).catch(gone);
    }, POLL);
  }
  function stopPoll() { if (poll) clearInterval(poll); poll = null; }
  function later() { clearTimeout(back); back = setTimeout(idle, IDLE_AFTER); }

  // ---- hidden / signed out ----
  function blank(msg) { cur = null; stopPoll(); clearTimeout(back); $("blank-msg").textContent = msg || ""; screen("blank"); }
  function ok(r) { if (r.redirected || r.status === 401 || r.status === 303) throw "out"; if (!r.ok) throw r.status; return r.json(); }
  function gone(e) { if (e === "out") blank("Sign in to Fizzy on the staff screen."); }

  // ---- messages from the staff screen ----
  function handle(m) {
    if (typeof m === "string") { try { m = JSON.parse(m); } catch (e) { return; } }
    if (!m || !m.type) return;
    if (m.auto && mode === "blank" && hidden) return;  // hidden from the menu stays hidden while staff move between pages
    if (m.type === "show") show(m.customer);
    else if (m.type === "idle") { hidden = false; idle(); }
    else if (m.type === "hide") { hidden = true; blank(""); }
  }
  window.fizzyDisplay = handle;                                   // the Mac app calls this
  if ("BroadcastChannel" in window) new BroadcastChannel("fizzy-display").onmessage = function (e) { handle(e.data); };  // same browser

  // Keep the screen awake where the browser allows it (the Mac app does this itself).
  function awake() { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) awake(); });
  awake(); idle();
})();
</script>
</body>
</html>
