{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login">
  <div class="mark">{% include "_logo.html" %}<div><b>Fizzy</b><span>Cooked Coke Co. · staff only</span></div></div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form class="panel" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="who">Who's on the counter</label>
    <select id="who" name="who">{% for n in staff_names %}<option>{{ n }}</option>{% endfor %}</select>
    <label for="pw">Password</label>
    <input id="pw" type="password" name="password" autofocus autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
